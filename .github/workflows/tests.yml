# Safe release checks only.
# Does not crawl live third-party targets.
# tests that import university_site stay skipped. A skip is not a pass.
# tests/test_exploit_step5.py (database extraction) is not collected.
# Do not switch this job to `unittest discover`.

name: tests

on:
  push:
  pull_request:

jobs:
  release-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: State coverage limits
        run: |
          echo "Command: python -m unittest tests.test_units tests.test_local_demo tests.test_cli_smoke tests.test_end_to_end"
          echo "Known skips: university_site end-to-end and access-control tests. A skip is not a pass."
          echo "Not run: tests.test_exploit_step5.py (database extraction against an in-process stand-in)."
          echo "No live third-party targets."
      - name: Run release tests
        run: python -m unittest tests.test_units tests.test_local_demo tests.test_cli_smoke tests.test_end_to_end -v
      - name: Build, install, and smoke the console script
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          pro-test --version
          pro-test --help > /dev/null
