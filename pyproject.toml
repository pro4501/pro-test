[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pro-test"
version = "1.0.0"
description = "Pure-Python (standard library only) web application vulnerability scanner modelled on Wapiti"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Pratham Brahmbhatt"}]
dependencies = []

[project.scripts]
pro-test = "protest.app.cli:main"

[tool.setuptools.packages.find]
include = ["protest*"]
